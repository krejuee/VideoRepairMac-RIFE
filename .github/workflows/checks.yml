name: Source checks

on:
  push:
    paths-ignore:
      - '**.md'
      - 'Bilder/**'
      - '**.zip'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libgl1 libxkbcommon0
      - name: Install Python packages
        run: |
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Prepare distribution and model
        run: python scripts/prepare_package.py
      - name: Check source and scripts
        run: |
          python -m compileall -q app.py engine.py review.py rife_backend.py media.py master.py storage.py i18n.py scripts vendor_rife tests
          bash -n Installieren.command Starten.command
          echo '6615790efd627772917205db291f51cd392528a157ecbb2ecaeec3bff8eb6de2  models/rife425/flownet.pkl' | sha256sum --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Package current V9 source
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoRepairMac-RIFE-v9
          path: VideoRepairMac-RIFE-v9.zip
      - name: Publish V9 download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v9.0.0 >/dev/null 2>&1; then
            gh release create v9.0.0 VideoRepairMac-RIFE-v9.zip SHA256SUMS-v9 --target "$GITHUB_SHA" --title "Video Repair RIFE 9" --notes-file RELEASE_NOTES.md
          fi
